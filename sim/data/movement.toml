# movement.toml - every feel-affecting number lives here.
# Units: metres, seconds, m/s, m/s^2. No Quake units anywhere past the .map parser.
# Reloadable at runtime; the loaded set is hashed into params_hash (iron law I).

[base]
base_speed    = 8.13     # m/s, before weapon speed_coefficient (section 5.10)
accel         = 10.0
air_accel     = 1.0
friction      = 6.0
stop_speed    = 2.54
gravity       = 20.32
jump_velocity = 6.86
step_height   = 0.46
stand_height  = 1.42
crouch_height = 0.91
player_radius = 0.405    # half of the 0.81 m box
crouch_speed_scale = 0.4 # fractional max speed while crouched

[parkour]
max_impulses       = 4   # placeholder until derived from map defence timings (8.3)
recharge_on_ground = true

[slide]
min_speed      = 5.08
friction_scale = 0.35
jump_boost     = 1.15
entry_boost    = 1.15   # speed multiplier applied when the slide starts
max_duration   = 1.5    # seconds before the slide ends on its own

[wallrun]
min_approach_speed = 6.35
max_duration       = 0.9
gravity_scale      = 0.35
normal_dot         = 0.7

[wallclimb]
max_duration = 0.7
climb_speed  = 4.57

[vault]
max_height    = 1.22
duration      = 0.35

[dash]
speed    = 11.43
cooldown = 1.0

[collision]
min_wall_thickness = 0.15   # must match the map making rules
max_slide_steps    = 4
max_bumps          = 4

[damage]
slow_factor = 0.85          # -15% movement while hit (section 6.10)
slow_ticks  = 96            # 1.5 s at 64 tick
headshot_mult = 5.0
