# combat.toml - HP and armour. Decided 2026-10-18: HP 100; armour 25 / 25 regen / 50.
# ADR 0006 (2026-10-24) fixed the model:
#   * body and legs consume the armour pool first; health only takes what spills
#     over once armour is empty (absorb_percent = 100),
#   * a headshot is TRUE damage: it ignores armour entirely.
# Regeneration timing (5 s delay, 10 s to refill) is confirmed as the starting
# point; it is tuning data, so a change here needs no code change.

[health]
max_health = 100

[armor.light]
max_armor      = 25
absorb_percent = 100
regenerates    = false

[armor.regen]
max_armor           = 25
absorb_percent      = 66
regenerates         = true
regen_delay_seconds = 5.0    # no damage for this long before it starts
regen_seconds       = 10.0   # time to refill from 0 to max

[armor.heavy]
max_armor      = 50
absorb_percent = 100
regenerates    = false
