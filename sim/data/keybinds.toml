# keybinds.toml - every bind is editable at runtime (iron law I).
# Defaults follow the Valorant ability layout: abilities on C / Q / E / X.
# Names are case insensitive; spaces are ignored ("left shift" works).
# The simulation never sees these names - only the resulting MoveInput.

[move]
forward = "W"
back    = "S"
left    = "A"
right   = "D"

[actions]
jump      = "SPACE"
crouch    = "LEFT_CTRL"
slide     = "LEFT_SHIFT"
dash      = "X"        # Valorant ultimate slot
wallrun   = "Q"        # Valorant ability 2
wallclimb = "V"        # was E; E belongs to interact (CS/Valorant)
vault     = "C"        # Valorant ability 1
fire      = "MOUSE_LEFT"   # M6: the trigger
aim       = "MOUSE_RIGHT"  # M6: aim down sights (spread/zoom arrive later)
reload    = "R"
interact  = "E"        # bomb / doors / pickups (M6-M8)
scoreboard = "TAB"
